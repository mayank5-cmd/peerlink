name: Bootstrap PeerLink source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Restore complete source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .peerlink-import ]; then
            echo "No staged source payload; nothing to do."
            exit 0
          fi
          cat .peerlink-import/*.b64 | base64 --decode > /tmp/peerlink-source.tar.xz
          mkdir -p /tmp/peerlink-source
          tar -xJf /tmp/peerlink-source.tar.xz -C /tmp/peerlink-source
          test -f /tmp/peerlink-source/peerlink/package.json
          cp -a /tmp/peerlink-source/peerlink/. .
          rm -rf peerlink .peerlink-import
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi
          git commit -m "feat: import complete PeerLink v0.2.1 source"
          git push origin HEAD:main
